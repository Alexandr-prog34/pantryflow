services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pantryflow
      POSTGRES_USER: pantryflow
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pantryflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pantryflow -d pantryflow"]
      interval: 5s
      timeout: 3s
      retries: 12

  server:
    build: ./server
    environment:
      DB_URL: jdbc:postgresql://db:5432/pantryflow
      DB_USER: pantryflow
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pantryflow_pgdata:
